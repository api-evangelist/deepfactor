name: deepfactor
description: >-
  Deepfactor was an application security (AppSec / ASPM) platform for cloud-native and
  containerized applications. Its integrated approach combined software composition analysis
  (SCA), software bill of materials (SBOM) generation, container image scanning, and container
  runtime security into a single developer-security platform. Its differentiating capability was
  runtime software composition analysis / runtime reachability, correlating static scans with
  observed runtime application behavior so teams could prioritize vulnerability remediation based
  on true usage. Use cases spanned Shift-Left & DevSecOps, supply chain security, SBOM, container
  runtime security & compliance (SOC 2), and cloud-native application security. Backed by Insight
  Partners. As of this enrichment pass (2026-07) the public website is offline — the apex domain
  (deepfactor.io) returns a Cisco 503 error page and the WP Engine-hosted www/docs hosts return
  "Site is not available", and DNS for the apex resolves to Cisco infrastructure; there is no
  live developer portal, API, SDK, CLI, GitHub organization, or published package to harvest.
